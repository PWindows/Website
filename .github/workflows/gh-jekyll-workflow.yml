# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  pull_request:
  # Runs on pushes targeting either publishable branch
  push:
    branches: ["main", "redesign"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.10'
          bundler-cache: true
      - name: Install dependencies
        run: bundle install
      - name: Build with Jekyll (with custom plugins)
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: Check generated HTML and internal links
        run: bundle exec htmlproofer ./_site --disable-external --ignore-urls '/minecraft:/'
      - name: Verify public pages, sitemap, and source data
        run: |
          bundle exec ruby tools/verify-site.rb ./_site
          bundle exec ruby tools/verify-localization.rb ./_site
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/extra.js
          node tools/tests/flip-cards-test.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser behavior
        run: |
          THEME_ROOT=$(bundle show pwindows-theme)
          npm ci --prefix "$THEME_ROOT/tools/browser"
          npm exec --prefix "$THEME_ROOT/tools/browser" -- playwright install --with-deps chromium
          BROWSER_SITE=website WEBSITE_SITE_DIR="$PWD/_site" npm --prefix "$THEME_ROOT/tools/browser" test
      - name: Upload artifact
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/redesign')
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: ${{ needs.build.result == 'success' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/redesign') }}
    concurrency:
      group: pages-production
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
