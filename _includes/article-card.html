{% assign article = include.article %}
<article
  class="article-card"
  data-date="{{ article.date | date: '%Y-%m-%d' }}"
  data-type="{{ article.type | escape }}"
  data-title="{{ article.title | escape }}"
>
  <a href="{{ article.url | relative_url }}" class="no-icon">
    <div
      class="banner"
      role="img"
      aria-label="{{ article.title | escape }} banner"
      style="background-image: url('{{ article.banner | relative_url | escape }}');"
    ></div>
    <div class="card-content">
      <span class="type-label">{{ article.type }}</span>
      <h2>{{ article.title }}</h2>
      <p>{{ article.summary | strip_html | truncate: 120 }}</p>
    </div>
  </a>
</article>
