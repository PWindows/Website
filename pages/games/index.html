---
layout: page
title: Games
permalink: /games
description: Explore games being developed by PWindows.
intro: Follow the games currently being developed by PWindows.
---

<div class="content-card-grid game-grid">
  {% for game in site.data.games %}
  <article class="content-card game-card">
    <span class="status-label">{{ game.status }}</span>
    <h2>{{ game.title }}</h2>
    <p>{{ game.summary }}</p>
    <a class="btn" href="{{ game.path | relative_url }}">View game</a>
  </article>
  {% endfor %}
</div>
