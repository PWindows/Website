title: PWindows
description: Discover PWindows, not just a Minecraft server
url: "https://www.pwindows.qzz.io"
markdown: kramdown
kramdown:
  input: GFM
languages: ["en-us", "zh-cn"]
lang_from_path: true
exclude_from_localization: ["assets", "_includes", "_layouts", "_site", "Gemfile", "Gemfile.lock", "README.md", "_config.yml", "_config.windows.yml", "CNAME", "AGENTS.md", "_data"]
exclude:
  - AGENTS.md
  - README.md
  - tools/
  - vendor/
  - assets/mojang/fonts/*.html
  - assets/mojang/fonts/*.css
  - assets/mojang/fonts/*.eot
  - assets/mojang/fonts/*.svg
  - assets/mojang/fonts/*.ttf
  - assets/mojang/fonts/*.otf
collections:
  articles:
    output: true
    permalink: /article/:name
    markdown: kramdown
plugins:
  - jekyll-sitemap
  - jekyll-polyglot
