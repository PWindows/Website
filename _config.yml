title: PWindows
description: Discover PWindows, not just a Minecraft server
url: "https://www.pwindows.qzz.io"
markdown: kramdown
kramdown:
  input: GFM
languages: ["en-us", "zh-cn"]
lang_from_path: true
parallel_localization: false
exclude_from_localization:
  - assets
  - sitemap.xml
  - pages/robots.txt
  - CNAME
exclude:
  - AGENTS.md
  - README.md
  - tools/
  - vendor/
  - assets/extra/
collections:
  articles:
    output: true
    permalink: /article/:name
    markdown: kramdown
plugins:
  - jekyll-polyglot
