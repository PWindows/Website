minecraft:
  codename: mcd
  path: /departments/minecraft
  staff_department: Minecraft
  en-us:
    name: Minecraft Department
    bio: Responsible for the Minecraft server, including its plugins and configuration. Also responsible for Minecraft Maps, resource packs, and other Minecraft-related content.
  zh-cn:
    name: MC部门
    bio: 负责MC服务器，包括其插件和配置。还负责MC地图、资源包和其他与MC相关的内容。
  ja-jp:
    name: Minecraft部門
    bio: Minecraftサーバーのプラグインや設定を含む運営・開発を担当しています。また、Minecraftのマップ、リソースパック、その他の関連コンテンツも担当します。

unity:
  codename: ud
  path: /departments/unity
  staff_department: Unity
  en-us:
    name: Unity Department
    bio: Responsible for Unity games and applications such as Sacred Remains. This includes playtesting, bug reporting, and development of new features.
  zh-cn:
    name: Unity部门
    bio: 负责Unity游戏和应用程序，例如Sacred Remains。这包括游戏测试、错误报告和新功能的开发。
  ja-jp:
    name: Unity部門
    bio: Sacred RemainsなどのUnityゲームやアプリケーションを担当しています。プレイテスト、不具合報告、新機能の開発などを行います。

roblox:
  codename: rd
  path: /departments/roblox
  staff_department: Roblox
  en-us:
    name: Roblox Department
    bio: Responsible for Roblox games and applications such as Obby of Dominance. This includes playtesting, bug reporting, and development of new features.
  zh-cn:
    name: 《罗布乐思》部门
    bio: 负责《罗布乐思》游戏和应用程序，例如Obby of Dominance。这包括游戏测试、错误报告和新功能的开发。
  ja-jp:
    name: Roblox部門
    bio: Obby of DominanceなどのRobloxゲームやアプリケーションを担当しています。プレイテスト、不具合報告、新機能の開発などを行います。
